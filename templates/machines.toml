# 머신과 앱 설치 대상 선언 — bin/dotfiles와 앱 설치 프로그램이 읽는다.
# 이 파일은 config/에 있으며 private repo로만 동기화된다 (호스트명 노출 주의).
# 제어 머신에서 SSH로 접근할 수 있는 머신만 등록한다.
# 이동형 랩탑은 SSH 배포 대상으로 등록하지 않고 local.apps를 사용한다.
# 해당 랩탑에서 `dotfiles pull`을 실행한다.
#
# [machines.<이름>]
# host = "ssh-호스트"            # ~/.ssh/config의 Host 별칭 또는 user@host
# components = "shell,codex"     # 이 머신에 적용할 컴포넌트 (shell, claude, codex, gemini)
# apps = ["codex", "claude"]     # 이 머신에 설치할 앱. 생략하면 defaults.apps 상속
# apps = []                     # 앱 자동 설치 없음
# agents_addition = "shared-machine.md" # config/ai/agents-additions/에 보관한 추가 지침
# zsh_addition = "example.zsh"          # config/shell/zshrc-additions/에 보관한 추가 셸 설정
# transport = "hub"              # hub: 원격이 GitHub에서 git pull (기본값)
#                                # direct: 제어 머신이 git push (GitHub 접근 불가 머신용,
#                                #   원격에서 1회: git config receive.denyCurrentBranch updateInstead)
# path = "~/dotfiles"            # 원격의 dotfiles 경로 (기본값 ~/dotfiles)
#
# 예시:
# [machines.work-server]
# host = "link.rtzr.ai"
# components = "shell,codex"
# apps = ["codex", "ripgrep", "jq"]
#
# [machines.gpu-common]
# host = "reaper-common.rtzr.ai"
# components = "shell"
# apps = ["ripgrep", "tmux"]
# transport = "direct"

# 이름 없는 로컬 실행 전용. [defaults]를 상속하지 않는다.
# 앱이 카탈로그에 있어도 이 목록이나 머신별 apps에서 선택해야 설치한다.
[local]
apps = ["codex", "claude", "right-shift-english"]

# 등록된 머신의 공통 기본 설정. 머신에 생략한 필드만 상속한다.
# components, apps, transport, path, agents_addition, zsh_addition을 지정할 수 있다.
# 머신에서 같은 필드를 명시하면 교체한다. apps = []는 앱 설치를 끈다.
# [local]에는 적용하지 않는다.
[defaults]
components = "shell,claude,codex"
apps = ["codex", "claude"]
